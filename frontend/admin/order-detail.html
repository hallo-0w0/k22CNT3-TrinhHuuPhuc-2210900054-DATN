<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết đơn hàng - PCLEAR Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-light sticky-top shadow-sm py-2">
        <div class="container-fluid">
            <a class="navbar-brand fw-semibold py-0" href="dashboard.html">
                <img src="../images/logo/logo.png" alt="PCLEAR" class="navbar-logo">
            </a>
            <div class="d-flex align-items-center gap-3 ms-auto">
                <a class="btn btn-outline-primary btn-sm" href="dashboard.html#orders">← Về danh sách</a>
                <a class="btn btn-outline-danger btn-sm" href="#" id="logoutLink">Đăng xuất</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid py-4">
        <div class="row">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h2 class="mb-1">Chi tiết đơn hàng</h2>
                        <div class="text-muted small" id="orderCode"></div>
                    </div>
                    <div id="orderActions"></div>
                </div>

                <div class="row g-4">
                    <!-- Order Info -->
                    <div class="col-12 col-lg-8">
                        <div class="card shadow-sm mb-4">
                            <div class="card-header bg-primary text-white">
                                <h5 class="mb-0">Thông tin đơn hàng</h5>
                            </div>
                            <div class="card-body" id="orderInfo"></div>
                        </div>

                        <!-- Customer Info -->
                        <div class="card shadow-sm mb-4">
                            <div class="card-header">
                                <h5 class="mb-0">Thông tin khách hàng</h5>
                            </div>
                            <div class="card-body" id="customerInfo"></div>
                        </div>

                        <!-- Service Info -->
                        <div class="card shadow-sm mb-4">
                            <div class="card-header">
                                <h5 class="mb-0">Thông tin dịch vụ</h5>
                            </div>
                            <div class="card-body" id="serviceInfo"></div>
                        </div>

                        <!-- Progress Timeline -->
                        <div class="card shadow-sm mb-4">
                            <div class="card-header">
                                <h5 class="mb-0">Tiến độ đơn hàng</h5>
                            </div>
                            <div class="card-body" id="progressTimeline"></div>
                        </div>
                    </div>

                    <!-- Sidebar -->
                    <div class="col-12 col-lg-4">
                        <!-- Status Card -->
                        <div class="card shadow-sm mb-4">
                            <div class="card-header">
                                <h5 class="mb-0">Trạng thái</h5>
                            </div>
                            <div class="card-body" id="statusCard"></div>
                        </div>

                        <!-- Payment Summary -->
                        <div class="card shadow-sm mb-4">
                            <div class="card-header">
                                <h5 class="mb-0">Tổng thanh toán</h5>
                            </div>
                            <div class="card-body" id="paymentSummary"></div>
                        </div>

                        <!-- Staff Assignment -->
                        <div class="card shadow-sm mb-4">
                            <div class="card-header">
                                <h5 class="mb-0">Nhân viên phụ trách</h5>
                            </div>
                            <div class="card-body" id="staffAssignment"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Status Update Modal -->
    <div class="modal fade" id="statusModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Cập nhật trạng thái</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="statusForm">
                        <div class="mb-3">
                            <label class="form-label">Trạng thái mới *</label>
                            <select class="form-select" id="newStatus" required>
                                <option value="PENDING">Chờ xử lý</option>
                                <option value="CONFIRMED">Đã xác nhận</option>
                                <option value="IN_PROGRESS">Đang thực hiện</option>
                                <option value="COMPLETED">Hoàn thành</option>
                                <option value="CANCELLED">Đã hủy</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Lý do (tùy chọn)</label>
                            <textarea class="form-control" id="statusReason" rows="3"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                    <button type="button" class="btn btn-primary" onclick="updateStatus()">Cập nhật</button>
                </div>
            </div>
        </div>
    </div>
    </div>
    <!-- Assign Staff Modal -->
    <div class="modal fade" id="assignStaffModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="assignModalTitle">Phân công nhân viên</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="assignStaffForm">
                        <div class="mb-3">
                            <label class="form-label">Chọn nhân viên *</label>
                            <select class="form-select" id="staffSelect" required>
                                <option value="">-- Chọn nhân viên --</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Ghi chú phân công</label>
                            <input type="text" class="form-control" id="assignNotes"
                                placeholder="Nhân viên chính / hỗ trợ...">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                    <button type="button" class="btn btn-primary" onclick="submitAssignment()">Lưu phân
                        công</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="js/order-detail.js"></script>
</body>

</html>
