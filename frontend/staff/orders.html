<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đơn hàng được phân công - PCLEAR Staff</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-light sticky-top shadow-sm py-2">
        <div class="container-fluid">
            <a class="navbar-brand fw-semibold py-0" href="orders.html">
                <img src="../images/logo/logo.png" alt="PCLEAR" class="navbar-logo"> Staff
            </a>
            <div class="d-flex align-items-center gap-3 ms-auto">
                <span class="text-dark fw-semibold small d-none d-md-inline" id="staffWelcome"></span>
                <a class="btn btn-outline-primary btn-sm" href="#" id="logoutLink">Đăng xuất</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-2 mb-4">
            <div>
                <h2 class="mb-1">Đơn hàng được phân công</h2>
                <div class="text-muted small">Quản lý và cập nhật tiến độ thực hiện dịch vụ.</div>
            </div>
            <div class="d-flex gap-2">
                <select class="form-select form-select-sm" style="max-width: 220px" id="statusFilter">
                    <option value="">Tất cả trạng thái</option>
                    <option value="CONFIRMED">Đã xác nhận</option>
                    <option value="IN_PROGRESS">Đang thực hiện</option>
                    <option value="COMPLETED">Hoàn thành</option>
                </select>
            </div>
        </div>

        <!-- Stats -->
        <div class="row g-3 mb-4">
            <div class="col-12 col-md-4">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <div class="text-muted small">Tổng đơn</div>
                        <div class="fs-3 fw-semibold" id="statTotal">—</div>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-4">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <div class="text-muted small">Đang thực hiện</div>
                        <div class="fs-3 fw-semibold" id="statInProgress">—</div>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-4">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <div class="text-muted small">Hoàn thành</div>
                        <div class="fs-3 fw-semibold" id="statCompleted">—</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Orders List -->
        <div class="card shadow-sm">
            <div class="card-body">
                <div id="ordersList">
                    <div class="text-center py-5">
                        <div class="spinner-border" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Chi tiết đơn hàng -->
    <div class="modal fade" id="orderDetailModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Chi tiết đơn hàng</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="orderDetailContent">
                    <div class="text-center py-5">
                        <div class="spinner-border" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Cập nhật tiến độ -->
    <div class="modal fade" id="progressModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Cập nhật tiến độ</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="progressForm">
                        <input type="hidden" id="progressOrderId">
                        <div class="mb-3">
                            <label for="progressNote" class="form-label">Ghi chú tiến độ *</label>
                            <textarea class="form-control" id="progressNote" rows="4" required
                                placeholder="Mô tả công việc đã thực hiện..."></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="progressImageUrls" class="form-label">URL hình ảnh (tùy chọn)</label>
                            <textarea class="form-control" id="progressImageUrls" rows="2"
                                placeholder="Dán URL hình ảnh, mỗi URL một dòng hoặc phân cách bằng dấu phẩy"></textarea>
                            <div class="form-text">Ví dụ: https://imgur.com/abc.jpg, https://imgur.com/def.jpg</div>
                        </div>
                        <div class="mb-3">
                            <label for="progressIssue" class="form-label">Báo cáo vấn đề (nếu có)</label>
                            <textarea class="form-control" id="progressIssue" rows="2"
                                placeholder="Mô tả vấn đề gặp phải (nếu có)"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                    <button type="button" class="btn btn-primary" id="btnSaveProgress">Lưu tiến độ</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="js/orders.js"></script>
</body>

</html>
