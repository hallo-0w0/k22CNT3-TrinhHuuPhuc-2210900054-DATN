<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đơn hàng của tôi - PCLEAR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="../index.html">🧹 PCLEAR</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="orders.html">Đơn hàng</a>
                <a class="nav-link" href="#" id="logoutLink">Đăng xuất</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-2">
            <div>
                <h2 class="mb-1">Đơn hàng của tôi</h2>
                <div class="text-muted small">Theo dõi trạng thái và lịch sử sử dụng dịch vụ.</div>
            </div>
            <div class="d-flex gap-2">
                <select class="form-select form-select-sm" style="max-width: 220px" id="statusFilter">
                    <option value="">Tất cả trạng thái</option>
                    <option value="PENDING">Chờ xử lý</option>
                    <option value="CONFIRMED">Đã xác nhận</option>
                    <option value="IN_PROGRESS">Đang thực hiện</option>
                    <option value="COMPLETED">Hoàn thành</option>
                    <option value="CANCELLED">Đã hủy</option>
                </select>
                <button class="btn btn-outline-light btn-sm d-none" id="dummyBtn"></button>
            </div>
        </div>

        <div class="row g-3 mt-1">
            <div class="col-12 col-md-4">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <div class="text-muted small">Tổng đơn</div>
                        <div class="fs-3 fw-semibold" id="statTotal">—</div>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-4">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <div class="text-muted small">Đang thực hiện</div>
                        <div class="fs-3 fw-semibold" id="statInProgress">—</div>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-4">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <div class="text-muted small">Hoàn thành</div>
                        <div class="fs-3 fw-semibold" id="statCompleted">—</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="card mt-4 shadow-sm">
            <div class="card-body">
                <div id="ordersList">
                    <div class="text-center py-5">
                        <div class="spinner-border" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="js/orders.js"></script>
</body>
</html>
